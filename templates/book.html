                <div class="form-group">
                    <label for="email"><span class="req">*</span> <span id="lbl-email">Email</span></label>

                </div>

                <div class="form-group">
                    <label for="arrival_date"><span class="req">*</span> <span id="lbl-arrival">Date of Arrival</span></label>
                    <input type="date" id="arrival_date" name="arrival_date" required onchange="updateMinDepartureDate()">
                </div>

                <div class="form-group">
                    <label for="departure_date"><span class="req">*</span> <span id="lbl-departure">Date of Departure</span></label>
                    <input type="date" id="departure_date" name="departure_date" required>
                </div>

                <div class="form-group">
                    <label for="duration"><span id="lbl-duration">Duration of Stay (Days)</span></label>
                    <select name="duration" id="duration">
                        <option value="">-- Select --</option>
                        {% for n in range(1, 22) %}
                            <option value="{{ n }}">{{ n }}</option>
                        {% endfor %}
                        <option value="Other">Other (Please specify)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="travelers"><span class="req">*</span> <span id="lbl-travelers">Total Travelers (Including Children)</span></label>
                    <select name="travelers" id="travelers" required>
                        <option value="">-- Select --</option>
                        {% for n in range(1, 22) %}
                            <option value="{{ n }}">{{ n }}</option>
                        {% endfor %}
                        <option value="Other">Other (Please specify)</option>
                    </select>
                </div>

                <div class="form-group full-width checkbox-group">
                    <input type="checkbox" id="children" name="children">
                    <label for="children" id="lbl-children">Do children intend to travel?</label>
                </div>

                <!-- Places of Interest Multi-Select Pill Box -->
                <div class="form-group full-width">
                    <label for="placesDropdown"><span id="lbl-places">Places of Interest?</span></label>
                    <div id="pillsContainer" class="pills-container"></div>
                    <input type="hidden" id="placesHiddenInput" name="places">

                    <select id="placesDropdown" onchange="addPlaceTag(this.value)">
                        <option value="">-- Select --</option>
                        <option value="Arusha National Park">Arusha National Park</option>
                        <option value="Tarangire National Park">Tarangire National Park</option>
                        <option value="Lake Manyara National Park">Lake Manyara National Park</option>
                        <option value="Ngorongoro Conservation Area">Ngorongoro Conservation Area</option>
                        <option value="Ndutu">Ndutu</option>
                        <option value="Serengeti National Park">Serengeti National Park</option>
                        <option value="Mount Kilimanjaro">Mount Kilimanjaro</option>
                        <option value="Nyerere National Park">Nyerere National Park</option>
                        <option value="Mikumi National Park">Mikumi National Park</option>

<script>
    // 1. Multilingual Support
    const translations = {
      en: {

        details: "Détails supplémentaires?", submit: "Soumettre la demande",
        selectLang: "Choisir une langue"
      },
      es: {
        subheading: "Crea tu experiencia de safari exclusiva",
        firstname: "Nombre", lastname: "Apellido",
        country: "País de residencia", email: "Correo electrónico",
        arrival: "Fecha de llegada", departure: "Fecha de salida",
        duration: "Duración de la estancia (Días)", travelers: "Viajeros totales",
        children: "¿Tienen intenciones de viajar niños?", places: "¿Lugares de interés?",
        traveltype: "¿Tipo de viaje?", vehicle: "¿Vehículo preferido?",
        details: "¿Detalles adicionales?", submit: "Enviar solicitud de reserva",
        selectLang: "Seleccionar idioma"
      },
      de: {
        subheading: "Gestalten Sie Ihr exklusives Safari-Erlebnis",
        firstname: "Vorname", lastname: "Nachname",
        country: "Aufenthaltsland", email: "E-Mail",
        arrival: "Anreisedatum", departure: "Abreisedatum",
        duration: "Dauer des Aufenthalts (Tage)", travelers: "Gesamtzahl der Reisenden",
        children: "Beabsichtigen Kinder zu reisen?", places: "Orte von Interesse?",
        traveltype: "Art der Reise?", vehicle: "Bevorzugtes Fahrzeug?",
        details: "Zusätzliche Details?", submit: "Buchungsanfrage absenden",
        selectLang: "Sprache wählen"
      },
      zh: {
        subheading: "打造您的专属游猎体验",
        firstname: "名字", lastname: "姓氏",
        country: "居住国家", email: "电子邮件",
        arrival: "到达日期", departure: "离开日期",
        duration: "停留时间（天）", travelers: "总游客人数",
        children: "是否有儿童同行？", places: "感兴趣的景点？",
        traveltype: "旅行类型？", vehicle: "首选车辆？",
        details: "其他补充信息？", submit: "提交预订请求",
        selectLang: "选择语言"
      }
    };

    function switchLang(lang, element) {
      const t = translations[lang];
      if (!t) return;

      document.getElementById('txt-subheading').innerText = t.subheading;
      document.getElementById('lbl-firstname').innerText = t.firstname;
      document.getElementById('lbl-lastname').innerText = t.lastname;
      document.getElementById('lbl-country').innerText = t.country;
      document.getElementById('lbl-email').innerText = t.email;
      document.getElementById('lbl-arrival').innerText = t.arrival;
      document.getElementById('lbl-departure').innerText = t.departure;
      document.getElementById('lbl-duration').innerText = t.duration;
      document.getElementById('lbl-travelers').innerText = t.travelers;
      document.getElementById('lbl-children').innerText = t.children;
      document.getElementById('lbl-places').innerText = t.places;
      document.getElementById('lbl-traveltype').innerText = t.traveltype;
      document.getElementById('lbl-vehicle').innerText = t.vehicle;
      document.getElementById('lbl-details').innerText = t.details;
      document.getElementById('btn-submit').innerText = t.submit;
      document.getElementById('label-select-lang').innerText = t.selectLang;

      document.querySelectorAll('.lang-opt').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
    }

    // 2. Places of Interest Tag/Pill Handling
    let selectedPlaces = [];

    function addPlaceTag(val) {
        if (!val || selectedPlaces.includes(val)) return;
        selectedPlaces.push(val);
        renderTags();
        document.getElementById('placesDropdown').value = '';
    }

    function removePlaceTag(val) {
        selectedPlaces = selectedPlaces.filter(item => item !== val);
        renderTags();
    }

    function renderTags() {
        const container = document.getElementById('pillsContainer');
        const hiddenInput = document.getElementById('placesHiddenInput');
        container.innerHTML = '';

        selectedPlaces.forEach(item => {
            const pill = document.createElement('div');
            pill.className = 'pill-tag';

            const label = document.createElement('span');
            label.textContent = item;

            const removeBtn = document.createElement('span');
            removeBtn.className = 'btn-remove-tag';
            removeBtn.textContent = '×';
            removeBtn.onclick = () => removePlaceTag(item);

            pill.appendChild(label);
            pill.appendChild(removeBtn);
            container.appendChild(pill);
        });

        hiddenInput.value = selectedPlaces.join(', ');
    }

    // 3. Date constraint helper
    function updateMinDepartureDate() {
        const arrivalInput = document.getElementById('arrival_date');
        const departureInput = document.getElementById('departure_date');
        if (arrivalInput.value) {
            departureInput.min = arrivalInput.value;
            if (departureInput.value && departureInput.value < arrivalInput.value) {
                departureInput.value = arrivalInput.value;
            }
        }
    }

    // 4. Textarea Character Count
    function updateCounter(textarea) {
        document.getElementById('charCounter').innerText = `${textarea.value.length} / 20000`;
    }
</script>
